name: Auto Promote Develop to Main

on:
  push:
    branches:
      - develop

permissions:
  contents: write
  pull-requests: write

jobs:
  promote:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create Pull Request to Main
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Auto promote develop to main"
          branch: auto/develop-to-main
          base: main
          title: "Auto: develop → main"
          body: "This PR was automatically created after successful CI on develop."